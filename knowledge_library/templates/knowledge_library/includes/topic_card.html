{% load aakh_tags %}
<li class="card card--topic card--topic-accent-{{ card.accent }}">
    <a class="card__body card__topic-link" href="{{ card.url }}" aria-labelledby="topic-{{ card.topic_key }}">
        <h3 class="card__title" id="topic-{{ card.topic_key }}">
            {% icon card.icon_name "card__topic-icon" %}
            <span class="card__topic-name">{{ card.name }}</span>
        </h3>
        <p class="card__summary">{{ card.summary }}</p>
    </a>
</li>
