{% load static aakh_tags %}
<li class="card card--topic">
    <div class="card__body">
        <img class="card__topic-icon" src="{% static 'img/topics/' %}{{ image }}.svg" alt="" width="48" height="48" loading="lazy">
        <h3 class="card__title"><a href="/knowledge-library/topics/{{ slug }}/">{{ title }}</a></h3>
        <p class="card__summary">{{ summary }}</p>
        <div class="card__footer">{% icon "arrow-right" %}</div>
    </div>
</li>
